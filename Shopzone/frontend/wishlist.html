<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Wishlist — ShopZone</title>
  <link rel="stylesheet" href="/css/styles.css?v=2" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%2310b981'/><text x='50' y='68' font-size='52' text-anchor='middle' fill='%2304121a' font-family='Arial' font-weight='bold'>S</text></svg>" />
  <script>try{if(localStorage.getItem("sz_theme")==="light")document.documentElement.dataset.theme="light";}catch(e){}</script>
</head>
<body>
  <main class="wrap">
    <a class="back-btn" href="/shop"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg> Back to shop</a>
    <div class="page-head">
      <h1>❤ My wishlist</h1>
      <p>Products you saved with the heart button — stored on your account, on every device you sign in from.</p>
    </div>
    <div class="grid" id="grid" style="padding:18px 0 60px"></div>
  </main>

  <script src="/js/api.js?v=2"></script>
  <script src="/js/store.js?v=2"></script>
  <script src="/js/ui.js?v=2"></script>
  <script>
    mountNav('wishlist'); mountFooter();
    if (!requireAuth()) { /* redirected */ }

    (async () => {
      const grid = document.getElementById('grid');
      try {
        await catalog();
        const d = await API.get('/me/wishlist');
        if (!d.items.length) {
          grid.innerHTML = `<div class="panel" style="grid-column:1/-1;text-align:center;padding:60px 20px">
            <div style="font-size:44px;margin-bottom:12px">🤍</div>
            <h3 style="margin-bottom:8px">Your wishlist is empty</h3>
            <p class="muted" style="margin-bottom:20px">Tap the heart on any product to save it here.</p>
            <a class="btn btn-primary" href="/shop">Browse products</a></div>`;
          return;
        }
        grid.dataset.unwishRemove = '1';
        grid.innerHTML = d.items.map((p, i) => productCard(p, i)).join('');
        bindAddButtons(grid);
        bindWishButtons(grid, new Set(d.items.map((i) => i.id)));
        initReveal();
      } catch (e) {
        grid.innerHTML = `<div class="error-banner">${e.message}</div>`;
      }
    })();
  </script>
</body>
</html>
